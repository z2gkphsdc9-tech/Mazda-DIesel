<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mazda Diesel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ios-style.css">
</head>
<body>
<main class="home">
  <h1 class="brand"><span class="t">Mazda Diesel</span><small>справочник</small></h1>
  <nav class="menu">
    <a class="big" href="parts.html"><span>🔧</span>Запчасти</a>
    <a class="big" href="guides.html"><span>📖</span>Инструкции</a>
  </nav>
</main>
<script>
(function(){
  document.querySelectorAll('.big').forEach(function(b){
    function up(){b.classList.remove('down')}
    b.addEventListener('pointerdown',function(){b.classList.add('down')});
    b.addEventListener('pointercancel',up);
    b.addEventListener('pointerleave',up);
    b.addEventListener('click',function(e){
      e.preventDefault();b.classList.add('down');
      setTimeout(function(){location.href=b.getAttribute('href')},280);
    });
  });
  addEventListener('pageshow',function(){document.querySelectorAll('.big.down').forEach(function(b){b.classList.remove('down')})});
})();
</script>
</body>
</html>
